# Tiny Tapeout project information
project:
  title:        "Nuat Labs Configurable SPI Controller" # Project title
  author:       "Nuat Labs"                            # Your name / organization
  discord:      ""                                     # Discord handle
  description:  "Nuat Labs SPI master controller supporting CPOL/CPHA modes 0-3, 1-16 bit words, clock divider, and dual chip select"
  language:     "Verilog"                              # Language
  clock_hz:     10000000                               # 10 MHz nominal operating frequency

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_nuatlabs_spi"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "spi_miso"
  ui[1]: "host_cs_n"
  ui[2]: "host_we"
  ui[3]: "host_addr[0]"
  ui[4]: "host_addr[1]"
  ui[5]: "host_addr[2]"
  ui[6]: "direct_start"
  ui[7]: "reserved"

  # Outputs
  uo[0]: "spi_sclk"
  uo[1]: "spi_mosi"
  uo[2]: "spi_cs0_n"
  uo[3]: "spi_busy"
  uo[4]: "spi_done"
  uo[5]: "spi_rx_ready"
  uo[6]: "spi_cs1_n"
  uo[7]: "spi_irq"

  # Bidirectional pins
  uio[0]: "host_data[0]"
  uio[1]: "host_data[1]"
  uio[2]: "host_data[2]"
  uio[3]: "host_data[3]"
  uio[4]: "host_data[4]"
  uio[5]: "host_data[5]"
  uio[6]: "host_data[6]"
  uio[7]: "host_data[7]"

# Do not change!
yaml_version: 6
